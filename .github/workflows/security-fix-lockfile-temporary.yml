# Temporary branch-scoped npm lockfile remediation; delete before PR review.
name: Foundation dependency lockfile repair (temporary)
on:
  push:
    branches: [security/dependency-audit-nov2026]
    paths: [.github/workflows/security-fix-lockfile-temporary.yml]
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile and apply compatible security patches
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo 'Review any remaining advisories manually'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): pin Foundation patched dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Report remaining advisories
        run: npm audit --audit-level=low || true
