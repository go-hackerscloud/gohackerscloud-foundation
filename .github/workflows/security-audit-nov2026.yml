name: Foundation dependency security and build
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - astro.config.mjs
      - src/**
      - public/**
      - scripts/**
      - .github/workflows/security-audit-nov2026.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly the reviewed versions
        run: npm ci --no-audit --no-fund
      - name: Fail on high/critical issues in all dependencies
        run: npm audit --audit-level=high
      - name: Fail on high/critical production dependency issues
        run: npm audit --omit=dev --audit-level=high
      - name: Build Foundation static site
        run: npm run build
      - name: Confirm built homepage and lesson pages exist
        run: |
          test -s dist/index.html
          test -d dist/foundation
          echo "Static Foundation build and learning tree present"
      - name: Validate crawler discovery and generated lesson sitemap
        run: node scripts/verify-discovery.mjs
      - name: Validate learner navigation and existing Foundation module routes
        run: node scripts/verify-foundation-learning.mjs
      - name: Validate three expanded guides and Academy lab overview
        run: node scripts/verify-expanded-guides.mjs
      - name: Validate Core IT learning path and reverse-sync safety
        run: node scripts/verify-core-learning.mjs
      - name: Validate architecture diagrams and original lesson URLs
        run: node scripts/verify-cloud-cyber-mermaid.mjs
      - name: Validate Stage 03 enterprise and professional Mermaid lessons
        run: node scripts/verify-enterprise-professional-mermaid.mjs
      - name: Validate Stage 01 and 02 diagrams and Obsidian sync
        run: node scripts/verify-stage01-stage02-mermaid.mjs
      - name: Validate platform overview and offerings navigation
        run: node scripts/verify-platform-offerings.mjs
      - name: Validate unified promotional catalog and Academy lab inventory
        run: node scripts/verify-unified-catalog.mjs
      - name: Check single page titles across Foundation public pages
        run: node scripts/verify-single-page-heading.mjs
      - name: Validate learner-first homepage and audience pathways
        run: node scripts/verify-learner-first-homepage.mjs
