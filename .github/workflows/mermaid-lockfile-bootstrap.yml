name: One-time Mermaid lockfile bootstrap
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - package.json
      - .github/workflows/mermaid-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'content/foundation-cloud-cyber-mermaid-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the lockfile to the feature branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize Mermaid lockfile for reproducible CI"
          git push origin HEAD:refs/heads/content/foundation-cloud-cyber-mermaid-v1
